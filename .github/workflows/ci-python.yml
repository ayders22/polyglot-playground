name: Python CI

on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Prepare
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-pip

      - name: Clean
        run: make clean-py

      - name: Format
        run: |
          make format-py
          git diff --exit-code

      - name: Format hello-world project
        run: |
          make format-py playground/thematic/concepts/hello-world
          git diff --exit-code

      - name: Test
        run: make test-py

      - name: Test hello-world project
        run: make test-py playground/thematic/concepts/hello-world

      - name: Lint
        run: make lint-py

      - name: Lint hello-world project
        run: make lint-py playground/thematic/concepts/hello-world

      - name: Benchmark
        run: make bench-py

      - name: Benchmark hello-world project
        run: make bench-py playground/thematic/concepts/hello-world

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Rust
            prepare: |
              rustup update stable
              rustup default stable
              rustup component add rustfmt clippy
            clean: make clean-rs
            format: |
              make format-rs
              git diff --exit-code
            lint: make lint-rs
            test: make test-rs
            benchmark: make bench-rs

          - name: Python
            prepare: |
              sudo apt-get update
              sudo apt-get install -y python3 python3-venv python3-pip
            clean: make clean-py
            format: |
              make format-py
              git diff --exit-code
            lint: make lint-py
            test: make test-py
            benchmark: make bench-py

          - name: C
            prepare: |
              sudo apt-get update
              sudo apt-get install -y build-essential cmake clang-format clang-tidy
            clean: make clean-c
            format: |
              make format-c
              git diff --exit-code
            lint: make lint-c
            test: make test-c
            benchmark: make bench-c

          - name: C++
            prepare: |
              sudo apt-get update
              sudo apt-get install -y build-essential cmake clang-format clang-tidy
            clean: make clean-cpp
            format: |
              make format-cpp
              git diff --exit-code
            lint: make lint-cpp
            test: make test-cpp
            benchmark: make bench-cpp

    steps:
      - uses: actions/checkout@v7

      - name: Prepare
        run: ${{ matrix.prepare }}

      - name: Clean
        run: ${{ matrix.clean }}

      - name: Format
        run: ${{ matrix.format }}

      - name: Lint
        run: ${{ matrix.lint }}

      - name: Test
        run: ${{ matrix.test }}

      - name: Benchmark
        run: ${{ matrix.benchmark }}

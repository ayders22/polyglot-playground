name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Prepare
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Clean
        run: make clean-rs

      - name: Format
        run: |
          make format-rs
          git diff --exit-code

      - name: Lint
        run: make lint-rs

      - name: Test
        run: make test-rs

      - name: Benchmark
        run: make bench-rs

  python:
    name: Python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Prepare
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-pip

      - name: Clean
        run: make clean-py

      - name: Format
        run: |
          make format-py
          git diff --exit-code

      - name: Lint
        run: make lint-py

      - name: Test
        run: make test-py

      - name: Benchmark
        run: make bench-py

  c:
    name: C
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Prepare
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang-format clang-tidy

      - name: Clean
        run: make clean-c

      - name: Format
        run: |
          make format-c
          git diff --exit-code

      - name: Lint
        run: make lint-c

      - name: Test
        run: make test-c

      - name: Benchmark
        run: make bench-c

  all-check:
    name: All check
    if: ${{ always() }}
    needs: [rust, python, c]
    runs-on: ubuntu-latest

    steps:
      - name: Verify results
        run: |
          test "${{ needs.rust.result }}" = "success"
          test "${{ needs.python.result }}" = "success"
          test "${{ needs.c.result }}" = "success"
